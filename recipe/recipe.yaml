schema_version: 1

context:
  name: i-pi
  version: "3.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/ipi/ipi-${{ version }}.tar.gz
  sha256: 0cea7805841efed7ce177cd2bc14b337966dc05df96afa10a01822b04712a79f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - numpy
    - python >=${{ python_min }}
    - scipy

tests:
  - python:
      imports:
        - ipi
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: licenses/license_MIT.txt
  summary: "i-PI: a universal force engine"
  description: |
    i-PI is a universal force engine interface written in Python, designed
    to be used together with an ab-initio (or force-field based)
    evaluation of the interactions between the atoms. The main goal is to
    decouple the problem of evolving the ionic positions to sample the
    appropriate thermodynamic ensemble and the problem of computing the
    inter-atomic forces.
  homepage: http://ipi-code.org
  repository: https://github.com/i-pi/i-pi
  documentation: https://ipi-code.org/i-pi/

extra:
  recipe-maintainers:
    - jan-janssen
